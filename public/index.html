<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jay OS</title>

  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet"/>

  <style>
    :root {
      --bg-primary: #030712;
      --bg-secondary: #0f172a;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.15);
      --accent-cyan: #22d3ee;
      --accent-violet: #a78bfa;
      --accent-pink: #f472b6;
      --text-primary: #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.6);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(34, 211, 238, 0.15), transparent),
        radial-gradient(ellipse 60% 50% at 80% 60%, rgba(167, 139, 250, 0.12), transparent),
        radial-gradient(ellipse 50% 40% at 50% 90%, rgba(244, 114, 182, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }

    /* ═══════════════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════════════ */
    #login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-card {
      width: 380px;
      padding: 48px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
      background: rgba(15, 23, 42, 0.8);
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(34, 211, 238, 0.3);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
    }

    .input-group input::placeholder {
      color: var(--text-secondary);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: var(--bg-primary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(34, 211, 238, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34, 211, 238, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-error {
      color: #f87171;
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }

    /* ═══════════════════════════════════════
       DESKTOP
    ═══════════════════════════════════════ */
    #desktop {
      display: none;
      height: 100vh;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* Menu Bar */
    .menubar {
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background: rgba(3, 7, 18, 0.7);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
    }

    .menubar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .menubar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .menubar-logo span {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .menubar-item {
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .menubar-item:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }

    .menubar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-secondary);
    }

    .menubar-time {
      font-variant-numeric: tabular-nums;
    }

    /* Workspace */
    .workspace {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
       DOCK
    ═══════════════════════════════════════ */
    .dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }

    .dock-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      position: relative;
    }

    .dock-icon:hover {
      transform: translateY(-12px) scale(1.15);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-light);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .dock-icon.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-primary);
    }

    .dock-divider {
      width: 1px;
      height: 40px;
      background: var(--border);
      margin: 0 4px;
    }

    .dock-icon.launchpad {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.2));
    }

    /* ═══════════════════════════════════════
       LAUNCHPAD
    ═══════════════════════════════════════ */
    #launchpad {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      flex-direction: column;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #launchpad.visible {
      opacity: 1;
    }

    .launchpad-header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .launchpad-search {
      width: 280px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }

    .launchpad-search:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .launchpad-search::placeholder {
      color: var(--text-secondary);
    }

    .launchpad-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .launchpad-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .launchpad-grid {
      flex: 1;
      padding: 20px 60px 40px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 24px;
      align-content: start;
    }

    .launchpad-grid::-webkit-scrollbar {
      width: 8px;
    }

    .launchpad-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .launchpad-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .launchpad-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 8px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .launchpad-app:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .launchpad-app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 1px solid var(--border);
      transition: transform 0.2s ease;
    }

    .launchpad-app:hover .launchpad-app-icon {
      transform: scale(1.08);
    }

    .launchpad-app-name {
      font-size: 12px;
      color: var(--text-primary);
      text-align: center;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════
       WINDOWS
    ═══════════════════════════════════════ */
    .window {
      position: absolute;
      width: 900px;
      height: 560px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .window.focused {
      z-index: 50;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    }

    .window-titlebar {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      cursor: grab;
      flex-shrink: 0;
    }

    .window-titlebar:active {
      cursor: grabbing;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      margin-right: 12px;
    }

    .window-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    .window-btn:hover {
      filter: brightness(1.2);
    }

    .window-btn.close { background: #f87171; }
    .window-btn.minimize { background: #fbbf24; }
    .window-btn.maximize { background: #4ade80; }

    .window-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      flex: 1;
      text-align: center;
      pointer-events: none;
    }

    .window-content {
      flex: 1;
      background: #0a0a0a;
    }

    .window-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Admin Panel Styles */
    .admin-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      gap: 16px;
    }

    .admin-textarea {
      flex: 1;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.4);
      color: #4ade80;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      resize: none;
    }

    .admin-textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .admin-save {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: var(--bg-primary);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      align-self: flex-end;
    }

    .admin-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(34, 211, 238, 0.3);
    }

    /* ═══════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════ */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .window {
      animation: fadeIn 0.2s ease;
    }
  </style>
</head>

<body>
  <div class="bg-gradient"></div>

  <!-- ═══════════════════════════════════════
       LOGIN SCREEN
  ═══════════════════════════════════════ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">❄️</div>
      <div class="login-title">Jay OS</div>
      <div class="login-subtitle">Enter your access key to continue</div>
      
      <div class="input-group">
        <input 
          id="pass" 
          type="password" 
          placeholder="Access key" 
          autocomplete="off"
          onkeydown="if(event.key === 'Enter') doLogin()"
        />
      </div>
      
      <button class="login-btn" onclick="doLogin()">Unlock</button>
      <div class="login-error" id="login-error">Invalid access key</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       DESKTOP
  ═══════════════════════════════════════ -->
  <div id="desktop">
    <div class="menubar">
      <div class="menubar-left">
        <div class="menubar-logo">
          ❄️ <span>Jay OS</span>
        </div>
        <div class="menubar-item" onclick="toggleLaunchpad()">Apps</div>
        <div class="menubar-item" id="admin-menu" style="display:none" onclick="openAdmin()">Admin</div>
      </div>
      <div class="menubar-right">
        <div class="menubar-time" id="time"></div>
      </div>
    </div>

    <div class="workspace" id="workspace">
      <!-- Windows spawn here -->
    </div>

    <div class="dock" id="dock">
      <div class="dock-icon launchpad" onclick="toggleLaunchpad()" title="Launchpad">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="dock-divider"></div>
      <!-- Apps render here -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       LAUNCHPAD
  ═══════════════════════════════════════ -->
  <div id="launchpad">
    <div class="launchpad-header">
      <input 
        type="text" 
        class="launchpad-search" 
        placeholder="Search apps..." 
        id="launchpad-search"
        oninput="filterApps(this.value)"
      />
      <button class="launchpad-close" onclick="toggleLaunchpad()">✕</button>
    </div>
    <div class="launchpad-grid" id="launchpad-grid">
      <!-- Apps render here -->
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let ROLE = "user";
    let KEY = "";
    let APPS = [];
    let windowZIndex = 10;

    // ═══════════════════════════════════════
    // LOGIN
    // ═══════════════════════════════════════
    async function doLogin() {
      const key = document.getElementById("pass").value;
      const errorEl = document.getElementById("login-error");
      
      errorEl.style.display = "none";

      const res = await fetch(API + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key })
      });

      const data = await res.json();

      if (data.ok) {
        ROLE = data.role;
        KEY = key;

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("desktop").style.display = "flex";

        await loadApps();
        renderDock();
        renderLaunchpad();

        if (ROLE === "admin") {
          document.getElementById("admin-menu").style.display = "block";
        }
      } else {
        errorEl.style.display = "block";
        document.getElementById("pass").value = "";
      }
    }

    // ═══════════════════════════════════════
    // APPS
    // ═══════════════════════════════════════
    async function loadApps() {
      const res = await fetch(API + "/apps");
      APPS = await res.json();
    }

    function renderDock() {
      const dock = document.getElementById("dock");
      
      // Remove existing app icons (keep launchpad and divider)
      const existingIcons = dock.querySelectorAll('.dock-icon:not(.launchpad)');
      existingIcons.forEach(icon => icon.remove());

      // Add first 6 unique apps to dock
      const uniqueApps = [];
      const seenNames = new Set();
      
      for (const app of APPS) {
        if (!seenNames.has(app.name)) {
          seenNames.add(app.name);
          uniqueApps.push(app);
        }
        if (uniqueApps.length >= 6) break;
      }

      uniqueApps.forEach(app => {
        const d = document.createElement("div");
        d.className = "dock-icon";
        d.innerHTML = app.icon || "🌐";
        d.title = app.name;
        d.onclick = () => openApp(app);
        dock.appendChild(d);
      });
    }

    function renderLaunchpad(filter = "") {
      const grid = document.getElementById("launchpad-grid");
      grid.innerHTML = "";

      const filterLower = filter.toLowerCase();
      const filteredApps = APPS.filter(app => 
        app.name.toLowerCase().includes(filterLower)
      );

      filteredApps.forEach(app => {
        const el = document.createElement("div");
        el.className = "launchpad-app";
        el.innerHTML = `
          <div class="launchpad-app-icon">${app.icon || "🌐"}</div>
          <div class="launchpad-app-name">${app.name}</div>
        `;
        el.onclick = () => {
          openApp(app);
          toggleLaunchpad();
        };
        grid.appendChild(el);
      });
    }

    function filterApps(query) {
      renderLaunchpad(query);
    }

    // ═══════════════════════════════════════
    // LAUNCHPAD
    // ═══════════════════════════════════════
    function toggleLaunchpad() {
      const lp = document.getElementById("launchpad");
      const isOpen = lp.style.display === "flex";
      
      if (isOpen) {
        lp.classList.remove("visible");
        setTimeout(() => { lp.style.display = "none"; }, 250);
        document.getElementById("launchpad-search").value = "";
        renderLaunchpad();
      } else {
        lp.style.display = "flex";
        requestAnimationFrame(() => lp.classList.add("visible"));
        document.getElementById("launchpad-search").focus();
      }
    }

    // ═══════════════════════════════════════
    // WINDOWS
    // ═══════════════════════════════════════
    function openApp(app) {
      const win = document.createElement("div");
      win.className = "window focused";
      win.style.zIndex = ++windowZIndex;
      
      // Random position
      const offsetX = Math.random() * 100 + 50;
      const offsetY = Math.random() * 80 + 60;
      win.style.left = offsetX + "px";
      win.style.top = offsetY + "px";

      win.innerHTML = `
        <div class="window-titlebar">
          <div class="window-controls">
            <button class="window-btn close" onclick="closeWindow(this)"></button>
            <button class="window-btn minimize" onclick="minimizeWindow(this)"></button>
            <button class="window-btn maximize" onclick="maximizeWindow(this)"></button>
          </div>
          <div class="window-title">${app.name}</div>
          <div style="width: 60px"></div>
        </div>
        <div class="window-content">
          <iframe src="${app.url}" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
      `;

      win.onclick = () => focusWindow(win);
      makeDraggable(win);
      
      document.getElementById("workspace").appendChild(win);
    }

    function closeWindow(btn) {
      btn.closest(".window").remove();
    }

    function minimizeWindow(btn) {
      const win = btn.closest(".window");
      win.style.display = "none";
    }

    function maximizeWindow(btn) {
      const win = btn.closest(".window");
      if (win.dataset.maximized === "true") {
        win.style.width = win.dataset.prevWidth;
        win.style.height = win.dataset.prevHeight;
        win.style.left = win.dataset.prevLeft;
        win.style.top = win.dataset.prevTop;
        win.dataset.maximized = "false";
      } else {
        win.dataset.prevWidth = win.style.width || "900px";
        win.dataset.prevHeight = win.style.height || "560px";
        win.dataset.prevLeft = win.style.left;
        win.dataset.prevTop = win.style.top;
        win.style.width = "100%";
        win.style.height = "calc(100% - 36px)";
        win.style.left = "0";
        win.style.top = "0";
        win.dataset.maximized = "true";
      }
    }

    function focusWindow(win) {
      document.querySelectorAll(".window").forEach(w => w.classList.remove("focused"));
      win.classList.add("focused");
      win.style.zIndex = ++windowZIndex;
    }

    function makeDraggable(win) {
      const titlebar = win.querySelector(".window-titlebar");
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      titlebar.addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("window-btn")) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = win.offsetLeft;
        initialTop = win.offsetTop;
        focusWindow(win);
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        win.style.left = initialLeft + dx + "px";
        win.style.top = initialTop + dy + "px";
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });
    }

    // ═══════════════════════════════════════
    // ADMIN
    // ═══════════════════════════════════════
    function openAdmin() {
      const win = document.createElement("div");
      win.className = "window focused";
      win.style.zIndex = ++windowZIndex;
      win.style.left = "100px";
      win.style.top = "60px";
      win.style.width = "700px";
      win.style.height = "500px";

      win.innerHTML = `
        <div class="window-titlebar">
          <div class="window-controls">
            <button class="window-btn close" onclick="closeWindow(this)"></button>
            <button class="window-btn minimize" onclick="minimizeWindow(this)"></button>
            <button class="window-btn maximize" onclick="maximizeWindow(this)"></button>
          </div>
          <div class="window-title">Admin Panel</div>
          <div style="width: 60px"></div>
        </div>
        <div class="window-content">
          <div class="admin-panel">
            <textarea class="admin-textarea" id="adminBox">${JSON.stringify(APPS, null, 2)}</textarea>
            <button class="admin-save" onclick="saveApps()">Save Changes</button>
          </div>
        </div>
      `;

      win.onclick = () => focusWindow(win);
      makeDraggable(win);
      
      document.getElementById("workspace").appendChild(win);
    }

    async function saveApps() {
      try {
        const data = JSON.parse(document.getElementById("adminBox").value);

        await fetch(API + "/apps", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: KEY, apps: data })
        });

        APPS = data;
        renderDock();
        renderLaunchpad();
        alert("Changes saved!");
      } catch (err) {
        alert("Invalid JSON format");
      }
    }

    // ═══════════════════════════════════════
    // CLOCK
    // ═══════════════════════════════════════
    function updateTime() {
      const now = new Date();
      const options = { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit', 
        minute: '2-digit'
      };
      document.getElementById("time").textContent = now.toLocaleDateString('en-US', options);
    }
    
    updateTime();
    setInterval(updateTime, 1000);

    // Keyboard shortcut to close launchpad
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const lp = document.getElementById("launchpad");
        if (lp.style.display === "flex") {
          toggleLaunchpad();
        }
      }
    });
  </script>
</body>
</html>
